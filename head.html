<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ganesh Chaturthi 2026 &mdash; Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
<style>
  :root{--kumkum:#A81E22;--kumkum-deep:#7C1417;--marigold:#EE9B00;--leaf:#2F6B3E;
    --paper:#FBF0D8;--paper-2:#FFFDF6;--ink:#3A2A18;--ink-soft:#7A6647;--rule:#E2D0AA}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Mukta","Segoe UI",Roboto,system-ui,sans-serif;background:var(--paper);
    color:var(--ink);font-size:16px;line-height:1.5;padding:0 0 48px;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px}
  .banner{background:var(--kumkum);color:#FFE9B8;text-align:center;padding:22px 16px 18px;
    border-bottom:5px solid var(--marigold)}
  .banner h1{font-family:"Yatra One",cursive;font-weight:400;font-size:clamp(1.75rem,7vw,2.6rem);
    color:#FFF3D0;line-height:1.15}
  .banner .year{display:block;color:var(--marigold);font-size:.62em}
  .stamp{margin-top:8px;font-size:.82rem;color:#F3C9A0}
  .garland{height:14px;background:repeating-linear-gradient(90deg,var(--marigold) 0 9px,#C97A00 9px 18px)}
  .totals{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
    border:1px solid var(--rule);margin:18px 0 6px}
  .totals div{background:var(--paper-2);padding:12px 14px}
  .totals .wide{grid-column:1 / -1;background:#FFF8E4}
  .totals dt{font-size:.85rem;color:var(--ink-soft)}
  .totals dd{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
  .totals .wide dd{font-size:2rem;color:var(--kumkum)}
  .in dd{color:var(--leaf)} .out dd{color:var(--kumkum)}
  h2{font-size:1.2rem;font-weight:800;margin:30px 0 2px;padding-bottom:5px;border-bottom:2px solid var(--kumkum)}
  .sub{font-size:.86rem;color:var(--ink-soft);margin:5px 0 10px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
  th{font-size:.78rem;font-weight:700;color:var(--ink-soft)}
  td.num,th.num{text-align:right;white-space:nowrap}
  tbody tr:nth-child(even){background:rgba(255,255,255,.55)}
  tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none;background:#FFF8E4;padding-top:11px}
  .who{font-weight:600}
  .who small{display:block;font-weight:400;font-size:.78rem;color:var(--ink-soft)}
  .who .when{color:var(--kumkum);font-weight:600}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:2px;white-space:nowrap}
  .t-paid{background:#DDEFE0;color:var(--leaf)}
  .t-part{background:#FBE6C4;color:#8A5200}
  .t-due{background:#F7DAD9;color:var(--kumkum-deep)}
  .mode{font-size:.78rem;color:var(--ink-soft)}
  table.split td:first-child{font-weight:600}
  table.split td:first-child small{display:block;font-weight:400;font-size:.76rem;color:var(--ink-soft)}
  .neg{color:var(--kumkum);font-weight:700}
  .notice{margin-top:26px;border-left:5px solid var(--marigold);background:#FFF8E4;padding:14px 16px}
  .notice h3{font-size:1rem;margin-bottom:5px}
  .notice.owed{border-left-color:var(--kumkum)}
  .notice p{font-size:.92rem;margin-bottom:7px}
  .notice p:last-child{margin-bottom:0}
  .big-due{font-weight:800;color:var(--kumkum);font-variant-numeric:tabular-nums}
  footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--rule);
    font-size:.82rem;color:var(--ink-soft);text-align:center}
  @media (max-width:520px){.hide-sm{display:none} th,td{padding:9px 4px} .totals dd{font-size:1.25rem}}
</style>
</head>
